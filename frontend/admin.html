<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | Amigo Secreto</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main class="container admin-container">
        <section class="card form-container">
            <div class="card-header">
                <h2>Panel de administración</h2>
                <p>Ingresa tus credenciales para continuar.</p>
            </div>

            <form id="adminLoginForm" class="modern-form" novalidate>
                <div class="input-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" name="username" placeholder="Nombre de administrador" required>
                    <span class="error-message" id="error-username">Ingresa tu usuario.</span>
                </div>

                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
                    <span class="error-message" id="error-password">Ingresa tu contraseña.</span>
                </div>

                <div class="form-feedback" id="adminFeedback"></div>

                <button type="submit" class="btn-primary" id="loginBtn">
                    <span class="btn-text">Ingresar</span>
                    <span class="loader hidden"></span>
                </button>
            </form>
            
            <div class="back-link-container">
                <a href="index.html" class="back-link">← Volver al inicio</a>
            </div>
        </section>
    </main>

    <script src="js/admin.js"></script>
</body>
</html>
