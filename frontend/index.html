<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amigo Secreto | Conecta y Sorprende</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Decoración de fondo -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <main class="container">
        <!-- Hero Section -->
        <section class="hero">
            <div class="hero-icon">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                    <polyline points="22,6 12,13 2,6"></polyline>
                    <path d="M12 17c-1.5-1.5-3.5-3-3.5-4.5A2.5 2.5 0 0 1 11 10c1 0 1 .5 1 .5s0-.5 1-.5a2.5 2.5 0 0 1 2.5 2.5C15.5 14 13.5 15.5 12 17z" fill="var(--color-emphasis)" stroke="none"></path>
                </svg>
            </div>
            <h1 class="hero-title">Amigo Secreto</h1>
            <p class="hero-subtitle">Conecta, sorprende y descubre quién será tu amigo secreto.</p>
        </section>

        <!-- Formulario de Registro -->
        <section class="card form-container">
            <div class="card-header">
                <h2>Únete al juego</h2>
                <p>Ingresa tus datos para participar en el amigo secreto.</p>
            </div>

            <form id="registerForm" class="modern-form" novalidate>
                <div class="input-group">
                    <label for="fullName">Nombre y apellido</label>
                    <input type="text" id="fullName" name="fullName" placeholder="Ej. María Pérez" required autocomplete="name">
                    <span class="error-message" id="error-fullName">Este campo es obligatorio.</span>
                </div>

                <div class="input-group">
                    <label for="singer">Cantante famoso</label>
                    <input type="text" id="singer" name="singer" placeholder="Ej. Shakira" required>
                    <span class="error-message" id="error-singer">Este campo es obligatorio.</span>
                </div>

                <div class="form-feedback" id="formFeedback"></div>

                <button type="submit" class="btn-primary" id="submitBtn">
                    <span class="btn-text">Enviar mis datos</span>
                    <span class="loader hidden"></span>
                </button>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <a href="admin.html" class="admin-link">Acceso administrador</a>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
